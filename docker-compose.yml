version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tourism-postgres
    environment:
      POSTGRES_DB: tourism
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 28122003
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tourism-network

  redis:
    image: redis:7-alpine
    container_name: tourism-redis
    ports:
      - "6379:6379"
    networks:
      - tourism-network

  backend:
    build: .
    container_name: tourism-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tourism
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 28122003
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - tourism-network

volumes:
  pgdata:

networks:
  tourism-network:
    driver: bridge
