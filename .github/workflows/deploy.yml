name: CI/CD Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v3

    - name: Thiết lập JDK 24 (Temurin)
      uses: actions/setup-java@v3
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: gradle

    - name: Cấp quyền thực thi cho gradlew
      run: chmod +x gradlew

    - name: Biên dịch và chạy Unit Tests
      run: ./gradlew build --no-daemon

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
    - name: Kết nối SSH vào VPS và Deploy bằng Docker Compose
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /var/www/quynhon-tourism
          git pull origin main
          export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
          docker-compose down
          docker-compose up -d --build
